# Done to increase the memory available to Gradle.
# IMPORTANT: this memory is for the Gradle daemon, not for the game.
org.gradle.jvmargs=-Xmx4G \
  --add-opens=java.base/java.util=ALL-UNNAMED \
  --add-opens=java.base/java.lang=ALL-UNNAMED \
  --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
  --add-opens=java.base/java.text=ALL-UNNAMED \
  --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
org.gradle.daemon=false

# Fabric Properties
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11

# Mod Properties
mod_version=1.1.4
maven_group=com.norwood.mcheli
archives_base_name=mcheli-fabric

# Fabric API
fabric_version=0.92.2+1.20.1

# Loom
# Use 1.6 (NOT 1.7+) to avoid the VersionsManifest Gson record issue
loom_version=1.6.11

# Build
# Adversary requires JDK 17 for 1.20.1
